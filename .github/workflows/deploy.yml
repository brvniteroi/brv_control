name: Deploy (control.brvniteroi.com.br)

on:
  push:
    branches: [main]
  workflow_dispatch:

# Um deploy por vez; um push novo espera o anterior terminar em vez de cancelá-lo no meio do envio
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

      # As variáveis VITE_* entram no JavaScript final: só chaves feitas para o navegador
      # (anon do Supabase, Maps restrita por site). Nunca service_role nem chave do Field Control.
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Upload de fotos publicado junto com o app (passo abaixo): mesmo domínio, sem CORS
          VITE_UPLOAD_URL: /api/upload.php
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}

      # As fotos ficam em api/uploads/ no servidor. O FTP-Deploy só apaga o que ele mesmo enviou,
      # então as fotos já gravadas lá não são removidas a cada deploy.
      - name: Incluir o upload de fotos e o envio de avaliação (dist/api)
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          APP_URL: https://control.brvniteroi.com.br
          # Mesmo valor de public.avaliacao_config.segredo (sem ele o e-mail de avaliação fica desligado)
          AVALIACAO_SEGREDO: ${{ secrets.AVALIACAO_SEGREDO }}
        run: |
          mkdir -p dist/api/uploads
          cp hostgator-api/upload.php hostgator-api/enviar-avaliacao.php hostgator-api/.htaccess dist/api/
          cp hostgator-api/uploads/.htaccess dist/api/uploads/
          node scripts/gerar-config-upload.mjs > dist/api/config.php

      - name: Publicar dist/ na HostGator (FTPS)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          # A conta FTP é presa à pasta do subdomínio, então a raiz dela é a raiz do app
          server-dir: ./
